name: release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope of release. Use major|minor|patch'
        required: true

jobs:
  "Linux":
    runs-on: ubuntu-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          java-package: 'jdk'
      - name: Release
        run: >
          ./gradlew final publishToSonatype
          -Prelease.scope=${{ github.event.inputs.scope }}
          -PisMainHost=true
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "MacOS-and-iOS":
    name: MacOS & iOS
    needs: [ Linux ]
    runs-on: macos-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          java-package: 'jdk'
      - name: Release
        run: >
          ./gradlew final :buildata-runtime:publishToSonatype
          -Pkotlin.native.linux.enabled=false
          -Prelease.useLastTag=true
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Windows":
    runs-on: windows-latest
    needs: [ Linux ]
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          java-package: 'jdk'
      - name: Release
        shell: cmd
        run: >
          .\gradlew.bat final :buildata-runtime:publishToSonatype
          -Pkotlin.native.linux.enabled=false
          -Prelease.useLastTag=true
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Close-Staging":
    runs-on: ubuntu-latest
    needs: [ MacOS-and-iOS, Windows, Linux ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          java-package: 'jdk'
      - name: Close and Release Sonatype Staging Repository
        run: >
          ./gradlew closeAndReleaseSonatypeStagingRepository
          -Prelease.useLastTag=true
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}