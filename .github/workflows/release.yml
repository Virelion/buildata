name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.0.0 or v1.0.0)'
        required: true
        type: string

jobs:
  "Initialize-Staging":
    runs-on: ubuntu-latest
    outputs:
      stagingRepositoryId: ${{ steps.init.outputs.stagingRepositoryId }}
      releaseTag: ${{ steps.init.outputs.releaseTag }}
      releaseVersion: ${{ steps.init.outputs.releaseVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Initialize Staging Repo and Save Build Info
        id: init
        run: |
          TAG_NAME="${{ github.event.release.tag_name || inputs.version }}"
          VERSION_NUMBER="${TAG_NAME#v}"

          ./gradlew initializeSonatypeStagingRepository saveBuildInformation \
            -Pversion="$VERSION_NUMBER" \
            -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }} \
            -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          
          # Reads stagingRepositoryId, releaseTag, and releaseVersion directly into outputs
          cat build/build.properties >> $GITHUB_OUTPUT

  "Linux":
    needs: [ Initialize-Staging ]
    runs-on: ubuntu-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Release Linux Artifacts
        run: >
          ./gradlew publishToSonatype
          -PisMainHost=true
          -Pversion=${{ needs['Initialize-Staging'].outputs.releaseVersion }}
          --staging-repository-id=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "MacOS-and-iOS":
    needs: [ Initialize-Staging ]
    runs-on: macos-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Release MacOS & iOS Artifacts
        run: >
          ./gradlew :buildata-runtime:publishToSonatype
          -Pkotlin.native.linux.enabled=false
          -Pversion=${{ needs['Initialize-Staging'].outputs.releaseVersion }}
          --staging-repository-id=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Windows":
    needs: [ Initialize-Staging ]
    runs-on: windows-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Release Windows Artifacts
        shell: bash
        run: >
          ./gradlew :buildata-runtime:publishToSonatype
          -Pkotlin.native.linux.enabled=false
          -Pversion=${{ needs['Initialize-Staging'].outputs.releaseVersion }}
          --staging-repository-id=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Close-Staging":
    needs: [ Initialize-Staging, Linux, MacOS-and-iOS, Windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Close Staging Repository
        run: >
          ./gradlew closeSonatypeStagingRepository
          -Pversion=${{ needs['Initialize-Staging'].outputs.releaseVersion }}
          --staging-repository-id=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Rollback-Staging":
    if: >-
      always() &&
      (
        needs['Initialize-Staging'].result == 'failure' || needs['Initialize-Staging'].result == 'cancelled' ||
        needs.Linux.result == 'failure' || needs.Linux.result == 'cancelled' ||
        needs['MacOS-and-iOS'].result == 'failure' || needs['MacOS-and-iOS'].result == 'cancelled' ||
        needs.Windows.result == 'failure' || needs.Windows.result == 'cancelled' ||
        needs['Close-Staging'].result == 'failure' || needs['Close-Staging'].result == 'cancelled'
      )
    needs: [ Initialize-Staging, Linux, MacOS-and-iOS, Windows, Close-Staging ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Drop Staging Repository
        run: |
          ./gradlew dropSonatypeStagingRepository \
            -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }} \
            --staging-repository-id=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
            -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }} \
            -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }} \
            -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }} || true

      - name: Delete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs['Initialize-Staging'].outputs.releaseTag }}"
          if [ -n "$TAG" ]; then
            echo "Attempting to delete GitHub Release for tag: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag=false || true
          fi

      - name: Delete Remote and Local Git Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs['Initialize-Staging'].outputs.releaseTag }}"
          if [ -n "$TAG" ]; then
            echo "Rolling back Git tag: $TAG"
            git tag -d "$TAG" || true
            git push origin --delete "$TAG" || true
          fi