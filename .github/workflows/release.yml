name: release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope of release. Use major|minor|patch'
        required: true

jobs:
  "Initialize-Staging":
    runs-on: ubuntu-latest
    outputs:
      stagingRepositoryId: ${{ steps.init.outputs.stagingRepositoryId }}
      releaseTag: ${{ steps.init.outputs.releaseTag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          java-package: 'jdk'
      - name: Create Git Tag and Initialize Staging Repo
        id: init
        run: |
          ./gradlew final initializeSonatypeStagingRepository saveBuildInformation \
            -Prelease.scope=${{ github.event.inputs.scope }} \
            -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }} \
            -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          
          cat build/build.properties >> $GITHUB_OUTPUT 

  "Linux":
    needs: [ Initialize-Staging ]
    runs-on: ubuntu-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          java-package: 'jdk'
      - name: Release Linux Artifacts
        run: >
          ./gradlew publishToSonatype
          -PisMainHost=true
          -Prelease.useLastTag=true
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "MacOS-and-iOS":
    needs: [ Initialize-Staging ]
    runs-on: macos-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Release MacOS & iOS Artifacts
        run: >
          ./gradlew :buildata-runtime:publishToSonatype
          -Pkotlin.native.linux.enabled=false
          -Prelease.useLastTag=true
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Windows":
    needs: [ Initialize-Staging ]
    runs-on: windows-latest
    env:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_SECRET_PASSWORD: ${{ secrets.GPG_SECRET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Release Windows Artifacts
        shell: cmd
        run: >
          .\gradlew.bat :buildata-runtime:publishToSonatype
          -Pkotlin.native.linux.enabled=false
          -Prelease.useLastTag=true
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Close-Staging":
    needs: [ Initialize-Staging, Linux, MacOS-and-iOS, Windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Close Staging Repository
        run: >
          ./gradlew closeSonatypeStagingRepository
          -Prelease.useLastTag=true
          -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }}
          -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}
          -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }}

  "Rollback-Staging":
    if: ${{ (cancelled() || failure()) && needs['Initialize-Staging'].outputs.stagingRepositoryId != '' }}
    needs: [ Initialize-Staging, Linux, MacOS-and-iOS, Windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Drop Staging Repository
        run: |
          ./gradlew dropSonatypeStagingRepository \
            -PstagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }} \
            -Psonatype.stagingRepositoryId=${{ needs['Initialize-Staging'].outputs.stagingRepositoryId }} \
            -Psonatype.username=${{ secrets.SONATYPE_USER_NAME }} \
            -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }}

      - name: Delete Remote and Local Git Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs['Initialize-Staging'].outputs.releaseTag }}"
          if [ -n "$TAG" ]; then
            echo "Rolling back Git tag: $TAG"
            git tag -d "$TAG" || true
            git push origin --delete "$TAG" || true
          fi